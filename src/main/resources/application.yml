server:
  # 신뢰 프록시(내부망 IP)가 보낸 X-Forwarded-For만 remoteAddr에 반영
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # JS에서 document.cookie로 세션 탈취 방지
        http-only: true
        # CSRF 완화 (탑레벨 GET 네비게이션만 쿠키 전송)
        same-site: lax
        # HTTPS 배포 시 true로 (로컬 http://localhost 는 false 유지)
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: ev
  datasource:
    url: jdbc:postgresql://localhost:5432/ev_charge
    username: ev_admin
    password: "${DB_PASSWORD:changeme}"
    hikari:
      maximum-pool-size: 70
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    # 켜 두면 TX 밖 조회가 요청 끝까지 커넥션을 잡고, REQUIRES_NEW도 같은 영속성 컨텍스트를 재사용할 수 있다
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

# 시크릿은 코드에 넣지 말고 .env / CI Secrets / 배포 환경변수로만 주입
kakao:
  maps:
    api:
      key: "${KAKAO_MAPS_API_KEY:}"
  local:
    rest-key: "${KAKAO_REST_API_KEY:}"
  mobility:
    rest-key: "${KAKAO_REST_API_KEY:}"
    base-url: https://apis-navi.kakaomobility.com

external-api:
  charging-station:
    base-url: http://apis.data.go.kr/B552584/EvCharger/getChargerInfo
    service-key: "${PUBLIC_DATA_API_KEY:}"
    num-of-rows: 1000

logging:
  file:
    name: logs/app.log

# Prometheus scrape: /actuator/prometheus (로컬 모니터링용 — 배포 시 네트워크 제한 권장)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 락 전략 전환 API(/api/admin/lock-strategy): 데모·부하 테스트 때만 true (기본 꺼짐, 켜면 로그인한 누구나 변경 가능)
app:
  admin:
    lock-strategy-toggle: ${APP_ADMIN_LOCK_STRATEGY_TOGGLE:false}

# 부하 테스트 시 Kakao 동시 호출 병목 회피 (락/폴백 로직은 동일, 순위만 직선거리)
loadtest:
  skip-kakao: true
